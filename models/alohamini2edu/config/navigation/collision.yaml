collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    odom_topic: /odom
    cmd_vel_in_topic: /cmd_vel
    cmd_vel_out_topic: /cmd_vel_safe
    state_topic: /collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons:
    - front_slowdown
    - front_stop
    front_slowdown:
      type: polygon
      points:
      - 1.0
      - 0.38
      - 1.0
      - -0.38
      - 0.31
      - -0.38
      - 0.31
      - 0.38
      action_type: slowdown
      slowdown_ratio: 0.35
      max_points: 8
      visualize: true
      polygon_pub_topic: /collision_monitor/front_slowdown
      enabled: true
    front_stop:
      type: polygon
      points:
      - 0.65
      - 0.32
      - 0.65
      - -0.32
      - 0.31
      - -0.32
      - 0.31
      - 0.32
      action_type: stop
      max_points: 4
      visualize: true
      polygon_pub_topic: /collision_monitor/front_stop
      enabled: true
    observation_sources:
    - scan
    scan:
      type: scan
      topic: /scan_filtered
      source_timeout: 0.5
      enabled: true

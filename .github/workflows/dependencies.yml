name: Dependency validation

on:
  pull_request:
    paths: ["pyproject.toml", "environment.yml", "env/**", "src/**", "tests/**", ".github/**"]
  push:
    branches: [main]
    paths: ["pyproject.toml", "environment.yml", "env/**", "src/**", "tests/**", ".github/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: linux-64
          - runner: ubuntu-24.04-arm
            architecture: linux-aarch64
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: latest
          activate-environment: alohamini_host
          environment-file: env/host.yml
          auto-activate-base: false
      - name: Install and verify Host dependencies
        env:
          HOST_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python -m pip install --require-hashes --no-build-isolation -r "env/host-$HOST_ARCHITECTURE.lock"
          python -m pip install --no-deps --no-build-isolation -e '.[host]'
          python -m pip check
          python env/verify_host.py
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash -el {0}
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: latest
          activate-environment: alohamini
          environment-file: environment.yml
          auto-activate-base: false
      - name: Install dependency tools
        run: |
          UV_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("env/dependencies.toml", "rb"))["uv"])')
          python -m pip install "uv==$UV_VERSION"
      - name: Check deployment manifests
        run: python env/dependencies.py check
      - name: Resolve and install CPU variant of the locked environment
        run: |
          mkdir -p reports
          python env/dependencies.py ci-lock --output reports/ci-linux-64.lock
          uv pip install --python "$CONDA_PREFIX/bin/python" --torch-backend cpu --require-hashes --no-build-isolation -r reports/ci-linux-64.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
          python -m pip freeze > reports/environment.txt
      - name: Algorithms, checkpoints, precision and distributed validation
        run: |
          python -m pytest -q --tb=short --junitxml=reports/cpu.xml \
            tests/test_dependencies.py tests/test_environment_manifests.py \
            tests/test_dependency_maintenance.py tests/test_checkpoint_probe.py \
            tests/test_lerobot_algorithms.py tests/test_training_precision.py \
            tests/test_distributed_validation.py tests/test_validation_loading.py \
            tests/test_checkpoint_retention.py tests/test_resume_paths.py \
            tests/test_acdit_training.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-cpu-${{ github.sha }}
          path: reports/
          retention-days: 30

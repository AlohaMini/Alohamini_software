name: macOS native compatibility

on:
  pull_request:
    paths: ["pyproject.toml", "environment.yml", "env/**", "src/**", "tests/**", ".github/workflows/macos.yml"]
  push:
    branches: [main, feat/macos-native]
    paths: ["pyproject.toml", "environment.yml", "env/**", "src/**", "tests/**", ".github/workflows/macos.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  serial:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
          - runner: macos-15-intel
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb
        with:
          miniforge-version: latest
          activate-environment: alohamini
          python-version: "3.12"
          auto-activate-base: false
      - name: Install and verify hardware dependencies
        run: |
          python -m pip install --require-hashes --no-build-isolation -r env/hardware.lock
          python -m pip install 'setuptools>=77' wheel pytest==8.4.2
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
          python env/macos_validation.py --sections serial --output reports/macos-serial
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: macos-serial-${{ runner.arch }}
          path: reports/macos-serial/
  pc:
    name: pc (${{ matrix.group }})
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - group: core
            sections: serial communication cache data video
          - group: training
            sections: training
    defaults:
      run:
        shell: bash -el {0}
    env:
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      PIP_CACHE_DIR: ${{ runner.temp }}/alohamini-pip-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb
        with:
          miniforge-version: latest
          activate-environment: alohamini
          environment-file: environment.yml
          auto-activate-base: false
      - name: Cache PC dependency downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-${{ runner.os }}-${{ runner.arch }}-pc-${{ hashFiles('environment.yml', 'env/pc-osx-arm64.lock') }}
      - name: Install native Apple Silicon dependencies
        run: |
          test "$(uname -m)" = arm64
          python -m pip install --require-hashes --no-build-isolation -r env/pc-osx-arm64.lock
          python -m pip install --no-deps --no-build-isolation -e '.[pc]'
          python -m pip check
          python env/dependencies.py check
      - name: Native PC validation
        run: python env/macos_validation.py --sections ${{ matrix.sections }} --output reports/macos-pc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: macos-pc-${{ matrix.group }}-${{ github.sha }}
          path: reports/macos-pc/

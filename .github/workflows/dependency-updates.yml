name: Dependency update candidates

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      group:
        type: choice
        description: Dependency group
        default: all
        options: [all, models, compute, host, tools]

permissions:
  contents: read

concurrency:
  group: dependency-update-candidates
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      pull-requests: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON((github.event_name == 'schedule' || inputs.group == 'all') && '["models","compute","host","tools"]' || format('["{0}"]', inputs.group)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Generate candidate locks
        id: candidate
        env:
          DEPENDENCY_GROUP: ${{ matrix.group }}
        run: |
          UV_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("env/dependencies.toml", "rb"))["uv"])')
          python -m pip install "uv==$UV_VERSION" packaging
          mkdir -p reports
          python env/dependencies.py refresh --group "$DEPENDENCY_GROUP" --report reports/changes.md 2>&1 | tee reports/resolution.log
          python env/dependencies.py check
      - name: Create or update candidate PR
        id: pr
        if: steps.candidate.outcome == 'success'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          branch: auto/dependencies/${{ matrix.group }}
          base: main
          title: "chore(deps): update ${{ matrix.group }} dependencies"
          commit-message: "chore(deps): update ${{ matrix.group }} dependencies"
          body-path: reports/changes.md
          draft: always-true
          add-paths: |
            pyproject.toml
            env/dependencies.toml
            env/*.in
            env/*.lock
      - name: Run checks on the candidate commit
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: auto/dependencies/${{ matrix.group }}
        # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
        run: |
          gh workflow run dependencies.yml --ref "$CANDIDATE_BRANCH"
          {
            printf 'Compatibility checks: [%s](https://github.com/%s/actions/workflows/dependencies.yml?query=branch%%3A%s)\n' "$CANDIDATE_BRANCH" "$GITHUB_REPOSITORY" "$CANDIDATE_BRANCH"
            printf '\nCandidate generation succeeded. Check the validation result before merging.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-proposal-${{ matrix.group }}
          path: reports/
          retention-days: 30

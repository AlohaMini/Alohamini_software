name: Dependency update candidates

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      group:
        type: choice
        description: Dependency group
        default: all
        options: [all, models, compute, host, tools]

permissions:
  contents: read

concurrency:
  group: dependency-update-candidates
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      pull-requests: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        group: [models, compute, host, tools]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: github.event_name == 'schedule' || inputs.group == 'all' || inputs.group == matrix.group
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: github.event_name == 'schedule' || inputs.group == 'all' || inputs.group == matrix.group
        with:
          python-version: "3.12"
      - name: Generate candidate locks
        id: candidate
        if: github.event_name == 'schedule' || inputs.group == 'all' || inputs.group == matrix.group
        env:
          DEPENDENCY_GROUP: ${{ matrix.group }}
        run: |
          UV_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("env/dependencies.toml", "rb"))["uv"])')
          python -m pip install "uv==$UV_VERSION" packaging
          mkdir -p reports
          python env/dependencies.py refresh --group "$DEPENDENCY_GROUP" --report reports/changes.md 2>&1 | tee reports/resolution.log
          python env/dependencies.py check
      - name: Create or update candidate PR
        id: pr
        if: steps.candidate.outcome == 'success'
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 # v8.0.0
        with:
          branch: auto/dependencies/${{ matrix.group }}
          base: main
          title: "chore(deps): update ${{ matrix.group }} dependencies"
          commit-message: "chore(deps): update ${{ matrix.group }} dependencies"
          body-path: reports/changes.md
          draft: always-true
          add-paths: |
            pyproject.toml
            env/dependencies.toml
            env/*.in
            env/*.lock
      - name: Run checks on the candidate commit
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: auto/dependencies/${{ matrix.group }}
        # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
        run: gh workflow run dependencies.yml --ref "$CANDIDATE_BRANCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && (github.event_name == 'schedule' || inputs.group == 'all' || inputs.group == matrix.group)
        with:
          name: dependency-proposal-${{ matrix.group }}
          path: reports/
          retention-days: 30

name: 机器人服务发现

on:
  pull_request:
    paths: ["src/alohamini/discovery.py", "src/alohamini/cli.py", "src/alohamini/client.py", "src/alohamini/runtime/**", "tests/test_discovery.py", "tests/test_client.py", "tests/test_software_version.py", "tests/test_host_version_warning.py", "env/connection.lock", "env/alohamini-discovery@.service", "pyproject.toml", ".github/workflows/discovery.yml"]
  push:
    branches: [main, feat/macos]
    paths: ["src/alohamini/**", "tests/test_discovery.py", "tests/test_client.py", "tests/test_software_version.py", "tests/test_host_version_warning.py", "env/connection.lock", "env/alohamini-discovery@.service", "pyproject.toml", ".github/workflows/discovery.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discovery:
    name: 广播与身份校验（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: 安装轻量连接依赖
        run: |
          python -m pip install --require-hashes -r env/connection.lock
          python -m pip install pytest==8.4.2
      - name: 验证发现协议与设备编号校验
        run: >-
          python -m pytest -q -m "not multicast" tests/test_discovery.py tests/test_software_version.py
          tests/test_client.py::ClientTransportTests::test_selected_device_identity_is_checked_before_binding_commands
          tests/test_client.py::ClientTransportTests::test_selected_device_environment_applies_to_existing_cli_clients
          tests/test_host_version_warning.py::test_equal_sources_do_not_warn_even_when_version_or_git_history_differ
          tests/test_host_version_warning.py::test_different_source_warns_once_and_preserves_snapshot_and_command_context
          tests/test_host_version_warning.py::test_old_host_without_identity_warns_once_and_remains_readable
      - name: 验证真实组播与独立发现进程退出
        if: runner.os == 'macOS'
        env:
          ALOHAMINI_DISCOVERY_TEST_INTERFACE: "127.0.0.1"
        run: python -m pytest -q -m multicast tests/test_discovery.py

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alohamini-robotwin"
version = "0.1.0.dev0"
description = "RoboTwin robot interface using shared AlohaMini assets"
requires-python = ">=3.10"
dependencies = ["alohamini-platform[simulation]", "sapien==3.0.0b1", "numpy>=1.26,<3"]

[project.scripts]
alohamini-robotwin = "alohamini_robotwin.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alohamini_robotwin*"]

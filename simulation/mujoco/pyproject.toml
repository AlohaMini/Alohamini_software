[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alohamini-mujoco"
version = "0.1.0.dev0"
description = "MuJoCo asset validation and trajectory execution for AlohaMini"
requires-python = ">=3.10"
dependencies = ["alohamini-platform", "mujoco==3.12.0", "numpy>=2,<3", "scipy>=1.14,<2", "pillow>=11"]

[project.optional-dependencies]
cad = ["cadquery-ocp-novtk==7.9.3.1.1"]
geometry = ["coacd==1.0.14", "manifold3d==3.5.4"]
collection = ["h5py>=3.11,<4"]

[project.scripts]
alohamini-mujoco = "alohamini_mujoco.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alohamini_mujoco*"]

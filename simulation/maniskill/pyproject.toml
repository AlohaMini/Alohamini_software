[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alohamini-maniskill"
version = "0.1.0.dev0"
description = "ManiSkill research environments using shared AlohaMini robot assets"
requires-python = ">=3.10"
dependencies = ["alohamini-platform[simulation]", "mani_skill==3.0.1", "sapien==3.0.3", "packaging>=24"]

[project.scripts]
alohamini-maniskill = "alohamini_maniskill.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alohamini_maniskill*"]
